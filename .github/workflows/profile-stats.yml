name: Refresh public profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate statistics from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_github_stats.py
      - name: Commit updated statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public GitHub statistics'
          git push
